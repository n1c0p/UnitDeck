#
# Lint, REUSE compliance and tests, on every pull request: `ci` is a required
# status check, and a workflow skipped by a path filter never reports it, which
# blocks pull requests with documentation-only or empty diffs (the sync PR after
# a release has no content changes at all).

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e ".[dev,gui,tui]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: REUSE compliance
        run: reuse lint
      - name: Tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  build-preview:
    # Preview package from develop: an artifact kept 14 days, no tag and no release.
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-24.04  # oldest supported Ubuntu, for glibc compatibility
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # The distribution's Python, not setup-python: its extension modules carry no RUNPATH
      # into the tool cache and the bundle matches what the package will run on.
      - name: Build tools
        run: |
          sudo apt-get install -y --no-install-recommends python3-venv libpython3.12 lintian rpm binutils libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python3 -m venv .venv
          .venv/bin/pip install ".[gui,tui]" pyinstaller
      - name: Build .deb and .rpm
        run: |
          PYTHON=.venv/bin/python packaging/stage.sh
          REUSE_STAGE=1 packaging/build-deb.sh
          REUSE_STAGE=1 packaging/build-rpm.sh
      - name: Clean install tests
        run: |
          packaging/test-install.sh dist/*.deb
          packaging/test-install.sh dist/*.rpm
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: unitdeck-packages-preview
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 14
