#
# Lint, REUSE compliance and tests. Documentation-only changes are skipped
# here and satisfied by ci-docs.yml, which provides a no-op `ci` job with the
# same name so the required check still passes.

name: CI

on:
  pull_request:
    branches: [develop, main]
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [develop]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: REUSE compliance
        run: reuse lint
      - name: Tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  build-preview:
    # Preview package from develop: an artifact kept 14 days, no tag and no release.
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-24.04  # oldest supported Ubuntu, for glibc compatibility
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # The distribution's Python, not setup-python: its extension modules carry no RUNPATH
      # into the tool cache and the bundle matches what the package will run on.
      - name: Build tools
        run: |
          sudo apt-get install -y --no-install-recommends python3-venv libpython3.12 lintian binutils libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python3 -m venv .venv
          .venv/bin/pip install . pyinstaller
      - name: Build .deb
        run: PYTHON=.venv/bin/python packaging/build-deb.sh
      - name: Clean install test
        run: packaging/test-install.sh dist/*.deb
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: unitdeck-deb-preview
          path: dist/*.deb
          retention-days: 14
