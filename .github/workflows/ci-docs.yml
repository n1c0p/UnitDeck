#
# Counterpart of ci.yml for documentation-only changes: the `ci` job is a
# required status check, and a skipped workflow would leave it pending forever.

name: CI (docs only)

on:
  pull_request:
    branches: [develop, main]
    paths: ["**.md", "docs/**"]
  push:
    branches: [develop]
    paths: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Documentation-only change, nothing to lint or test."
