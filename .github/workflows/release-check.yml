#
# Gates for pull requests into main. Runs on every such PR, including
# documentation-only ones (a release PR usually touches only the changelogs).

name: Release check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-origin:
    runs-on: ubuntu-latest
    steps:
      - name: Source branch must be develop or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|hotfix/*) echo "OK: $HEAD_REF" ;;
            *) echo "::error::PRs into main must come from develop or hotfix/*, not $HEAD_REF"; exit 1 ;;
          esac

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate changelog version against existing tags
        run: |
          set -eu
          heading="$(grep -m1 -E '^## \[' CHANGELOG.md || true)"
          version="$(printf '%s' "$heading" | grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' \
                     | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          if [ -z "$version" ]; then
            echo "::error::CHANGELOG.md must start with a '## [X.Y.Z] - YYYY-MM-DD' section, found: ${heading:-nothing}"
            exit 1
          fi
          if ! grep -qxF "$heading" CHANGELOG.it.md; then
            echo "::error::CHANGELOG.it.md does not contain the same heading: $heading"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          latest="$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -n1)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "::error::Version $version is not greater than the latest release $latest"
            exit 1
          fi
          echo "OK: release $version (latest: ${latest:-none})"
