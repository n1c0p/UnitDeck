name: Feature request
description: Suggest an improvement or a new service template
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Italian is fine too. Timers, sockets, remote machines and containers are out of scope for now."
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that UnitDeck does not allow today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
      description: "For a new service template, paste the unit file with {PLACEHOLDERS} for the fields to ask."
