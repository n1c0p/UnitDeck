version = 1

# src/*.egg-info is generated by an editable install; some git versions do not
# report it as ignored, so it is covered here instead of failing reuse lint.

[[annotations]]
path = ["LICENSE", "*.md", "docs/**", "site/**", ".gitignore", "src/*.egg-info/**", "packaging/copyright"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nicola Palmieri (n1c0p)"
SPDX-License-Identifier = "GPL-3.0-or-later"
