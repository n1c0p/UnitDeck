[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "unitdeck"
dynamic = ["version"]
description = "Desktop application to manage systemd system and user services"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Nicola Palmieri (n1c0p)" }]
keywords = ["systemd", "services", "gui", "qt", "linux"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
]
dependencies = ["PyQt6>=6.7"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "reuse"]

[project.scripts]
unitdeck = "unitdeck.__main__:main"

[project.urls]
Homepage = "https://github.com/n1c0p/UnitDeck"
Changelog = "https://github.com/n1c0p/UnitDeck/blob/main/CHANGELOG.md"
Issues = "https://github.com/n1c0p/UnitDeck/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/unitdeck/_version.py"
version_file_template = """# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 Nicola Palmieri (n1c0p)
# Generated by setuptools-scm from the git tag, do not edit or commit.
__version__ = version = {version!r}
__version_tuple__ = version_tuple = {version_tuple!r}
"""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
